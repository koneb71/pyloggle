[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyloggle"
version = "0.2.0"
description = "Lightweight log + error tracking SDK for Pyloggle (structured tracebacks, breadcrumbs, Flask/FastAPI/Django/logging integrations)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Pyloggle"}]
license = {text = "MIT"}
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Logging",
  "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
flask = ["flask>=2.3"]
fastapi = ["fastapi>=0.110"]
django = ["django>=4.2"]
test = ["pytest>=8", "flask>=2.3", "fastapi>=0.110", "httpx>=0.27", "django>=4.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyloggle*"]

[tool.setuptools.package-data]
pyloggle = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
