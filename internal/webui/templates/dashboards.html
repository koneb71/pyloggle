{{define "dashboards.html"}}{{template "base" .}}{{end}}

{{define "content"}}
  <div id="pyloggle-live-dashboards" class="vstack gap-3">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div>
        <div class="text-secondary small">Project</div>
        <div class="fw-semibold">{{.Project.ID}}{{if .Project.Name}} <span class="text-secondary">· {{.Project.Name}}</span>{{end}}</div>
      </div>
      <div class="text-secondary small">error trend</div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
          <h1 class="h4 mb-0">Dashboards</h1>
          <div class="text-secondary small">Trend</div>
        </div>

        <form method="get" action="/ui/dashboards" class="row g-2 align-items-end"
              hx-get="/ui/dashboards" hx-target="#pyloggle-live-dashboards" hx-swap="outerHTML" hx-push-url="true">
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary mb-1">Service</label>
            <input class="form-control form-control-sm" name="service" placeholder="service" value="{{.Service}}" />
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary mb-1">Env</label>
            <input class="form-control form-control-sm" name="env" placeholder="env" value="{{.Env}}" />
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary mb-1">From (UTC)</label>
            <input class="form-control form-control-sm" type="datetime-local" name="from" value="{{formatDTLocal .From}}" />
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary mb-1">To (UTC)</label>
            <input class="form-control form-control-sm" type="datetime-local" name="to" value="{{formatDTLocal .To}}" />
          </div>
          <div class="col-12 col-md-2">
            <label class="form-label small text-secondary mb-1">Bucket (seconds)</label>
            <input class="form-control form-control-sm" name="bucket_seconds" placeholder="60" value="{{.Bucket}}" />
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button class="btn btn-primary btn-sm" type="submit">Update</button>
          </div>
          <div class="col-12">
            <div class="form-text">
              Tip: leave from/to empty for default (last ~1h). Times are UTC.
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm"
         id="pyloggle-dashboards-results"
         hx-get="{{.CurrentURI}}"
         hx-trigger="every {{.PollSeconds}}s"
         hx-target="#pyloggle-dashboards-results"
         hx-select="#pyloggle-dashboards-results"
         hx-swap="outerHTML">
      <div class="card-body">
        <div class="bg-body-tertiary border rounded-3 p-2">
          {{.SVG}}
        </div>
      </div>
    </div>
  </div>
{{end}}
