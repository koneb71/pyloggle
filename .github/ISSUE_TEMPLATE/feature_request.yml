name: Feature request
description: Suggest an improvement or something new.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the situation, not only the solution. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, from the point of view of someone using it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else have you tried?
      description: Workarounds you use now, or other ways it could work.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
