name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (format, vet, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  integration:
    name: Go (ClickHouse integration)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        env:
          CLICKHOUSE_USER: pyloggle
          CLICKHOUSE_PASSWORD: pyloggle
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user pyloggle --password pyloggle --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags integration -count=1 ./internal/storage/clickhouse/
        env:
          PYLOGGLE_TEST_CLICKHOUSE_DSN: clickhouse://pyloggle:pyloggle@localhost:9000/default

  web:
    name: Web UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  python:
    name: Python SDK ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: python -m pytest
      - name: The committed golden fixture is complete and clean
        run: python tests/gen_golden.py --check

  package:
    name: Packaging dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Release archives
        run: |
          scripts/build-release.sh 0.0.0-ci dist
          tar -xzf dist/pyloggle_0.0.0-ci_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pyloggle_0.0.0-ci_linux_amd64/ingestd" -version
      - name: Python SDK distribution
        run: |
          pip install build twine
          python -m build python-sdk
          twine check python-sdk/dist/*
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker image (amd64 + arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.ingestd
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}

  hygiene:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/check-tree.sh
      - run: scripts/check-versions.sh
      - name: Third-party notices are up to date
        run: |
          (cd web && npm ci)
          make licenses
          git diff --exit-code -- THIRD_PARTY_LICENSES.md web/public/licenses.txt
