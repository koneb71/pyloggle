<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Pyloggle</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%232a78d6'/%3E%3Crect x='6' y='13' width='3' height='5' rx='1' fill='%23fff' opacity='.7'/%3E%3Crect x='10.5' y='9' width='3' height='9' rx='1' fill='%23fff' opacity='.85'/%3E%3Crect x='15' y='6' width='3' height='12' rx='1' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pyloggle.theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
